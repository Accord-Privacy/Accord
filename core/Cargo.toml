[package]
name = "accord-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
ring = { workspace = true }
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Cryptography (using ring instead of libsignal for now)
# opus = "0.3"  # Will add back when we implement voice

# Networking
quinn = "0.11"  # QUIC implementation

# Serialization
bincode = "1.3"
flate2 = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# BIP39 mnemonic generation
bip39 = "2.1"

# Ed25519 signatures
ed25519-dalek = { workspace = true, features = ["rand_core"] }

# Key derivation
hkdf = "0.12"
sha2 = "0.10"

# SRTP voice encryption
aes = { version = "0.8", features = ["zeroize"] }
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"

# Base64 encoding
base64 = "0.21"

# Unicode properties and NFC for attachment file-name sanitization (SPEC-02 REQ-23)
icu_properties = { version = "2.2", default-features = false, features = ["compiled_data"] }
icu_normalizer = { version = "2.2", default-features = false, features = ["compiled_data"] }

# Hex encoding
hex = "0.4"

# Hostname detection
hostname = "0.4"

# Random generation
rand = "0.8"

# Serialization for push metadata
serde_json = "1.0"

# Double Ratchet dependencies
x25519-dalek = { workspace = true }
aes-gcm = { workspace = true }
zeroize = { workspace = true }

# JNI for Android
jni = { version = "0.21", optional = true }

[features]
default = []
android = ["jni"]
# Exposes `attachment::seal_with_fixed_key_for_vectors`, which seals under the
# fixed key and nonce prefix of SPEC-02's known-answer vectors. Only this
# crate's own tests enable it (dev-dependency below); a build that ships must
# never enable it, because one key and prefix for two files reuses AES-GCM
# nonces (SPEC-02 REQ-1).
test-vectors = []

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dev-dependencies]
criterion = "0.5"
# The attachment vector tests (tests/attachment_vectors.rs) need the fixed-key
# sealer; with resolver 2 this feature is active only when tests are built.
accord-core = { path = ".", features = ["test-vectors"] }

[[bench]]
name = "crypto_benchmarks"
harness = false