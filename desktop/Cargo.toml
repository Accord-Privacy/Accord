[package]
name = "accord-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
accord-core = { path = "../core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true

# Tauri dependencies
tauri = { version = "2.0", features = [] }
tauri-plugin-updater = "2"

# HTTP client for connectivity testing
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }

# Cryptography
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand = { workspace = true }
base64 = { workspace = true }
hex = "0.4"

# Desktop integration
dirs = "5.0"
# Native save dialog for verified attachments (SPEC-02 REQ-22, OD-47), called
# only from Rust. This is the library behind tauri-plugin-dialog's Rust API; the
# plugin itself is not registered because it injects a script that replaces
# window.alert and window.confirm with IPC calls the webview must not be
# allowed to make (the webview gets no dialog permission).
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Direct WebKitGTK access for the webview permission handler (microphone) and
# mock capture devices in automated tests. Version/features match tauri's.
webkit2gtk = { version = "2", features = ["v2_40"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
